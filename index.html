<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PMM — Sistema de Comparecencias Policiales</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:#08111e;font-family:Georgia,'Times New Roman',serif;color:#dde6f0;}
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-track{background:#08111e;}
    ::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px;}
    ::-webkit-scrollbar-thumb:hover{background:#c9a84c55;}
    input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.6);cursor:pointer;}
    select option{background:#0f1f35;color:#dde6f0;}
    @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;
const STORAGE_KEY = 'pmm_ficha_v1';
const uid = () => Math.random().toString(36).slice(2,8);

/* ─── CONSTANTS ──────────────────────────────────────────────────────────── */
const TIPOS_DOC = ["DNI","NIE","Pasaporte","TIE","Permiso de residencia","Tarjeta consular","Sin documentación"];
const NACIONALIDADES = ["Española","Marroquí","Colombiana","Ecuatoriana","Venezolana","Rumana","Boliviana","Peruana","Dominicana","China","Senegalesa","Guineano-Ecuatorial","Hondureña","Nicaragüense","Salvadoreña","Paraguaya","Argentina","Cubana","Brasileña","Nigeriana","Paquistaní","Bangladesí","Otra"];
const DELITOS_MANUAL = [
  "Art. 368 CP — Tráfico de drogas","Art. 369.1.5ª CP — Tráfico drogas / notoria importancia",
  "Art. 370 CP — Jefatura organización / tipo hiperagravado","Art. 563 CP — Tenencia armas prohibidas",
  "Art. 564 CP — Tenencia armas sin licencia","Art. 550 CP — Atentado a la autoridad",
  "Art. 556 CP — Resistencia / desobediencia grave","Art. 147.1 CP — Lesiones",
  "Art. 148 CP — Lesiones agravadas","Art. 149 CP — Lesiones gravísimas",
  "Art. 153 CP — Lesiones ámbito familiar/pareja","Art. 169 CP — Amenazas graves",
  "Art. 172 CP — Coacciones","Art. 172 ter CP — Stalking/acoso",
  "Art. 234 CP — Hurto","Art. 237/240 CP — Robo con fuerza",
  "Art. 242 CP — Robo con violencia/intimidación","Art. 243 CP — Extorsión",
  "Art. 248 CP — Estafa","Art. 253 CP — Apropiación indebida",
  "Art. 263 CP — Daños dolosos","Art. 245 CP — Usurpación de inmueble",
  "Art. 298/299 CP — Receptación","Art. 390/392 CP — Falsificación documental",
  "Art. 401 CP — Usurpación estado civil","Art. 202 CP — Allanamiento de morada",
  "Art. 185 CP — Exhibicionismo ante menores","Art. 178/179 CP — Agresión sexual",
  "Art. 181 CP — Actos sexuales con menor de 16","Art. 557 CP — Desórdenes públicos",
  "Art. 379.2 CP — Conducción bajo alcohol/drogas","Art. 383 CP — Negativa a alcoholemia",
  "Art. 455 CP — Realización arbitraria del propio derecho",
  "Art. 468 CP — Quebrantamiento de alejamiento","Infracción administrativa LO 4/2015",
];
const ACTUACIONES = [
  "Detención","Identificación y puesta en libertad","Denuncia administrativa",
  "Traslado a dependencias para identificación (Art. 16 LO 4/2015)",
  "Detención y traslado","Entrega a otras fuerzas policiales",
];
const DESTINOS = [
  "Comisaría Central de Seguridad","Comisaría de Tráfico","Juzgado de Guardia",
  "Dependencias del Cuerpo Nacional de Policía","Dependencias de la Guardia Civil",
  "UTPJ (Unidad Territorial de Policía Judicial)","Hospital / Centro de salud",
  "Otro (escribir)",
];
const ZONAS_IMPACTO = [
  "Tronco anterior","Tronco posterior","Zona lumbar","Muslo derecho",
  "Muslo izquierdo","Pierna derecha","Pierna izquierda","Brazo derecho","Brazo izquierdo","Cadera",
];
const ESTADOS_DEC = [
  "Neutralizado y controlado en el suelo",
  "Parcialmente neutralizado, requirió reenergización",
  "Sin efecto aparente del DEC",
  "Cooperativo tras la descarga",
  "Trasladado al SAMUR para valoración médica",
];
const RELACION_VEH = ["Del autor","De la víctima","Testigo","En fuga","Abandonado en la zona","No determinada"];

const CRIME_SYSTEM_PROMPT = `Eres un experto jurista penal español. Analiza los hechos descritos e identifica TODOS los posibles delitos del Código Penal español que podrían ser de aplicación, incluyendo concurso de delitos si procede. Devuelve ÚNICAMENTE JSON válido sin ningún texto adicional, sin markdown, sin backticks, con este formato exacto: {"delitos":[{"articulo":"Art. X CP","tipo":"Nombre del tipo penal","pena":"rango de pena","obs":"observación breve relevante si procede, si no dejar vacío"}]}. Legislación aplicable incluye: Arts. 147-149 CP (lesiones), Art. 153 CP (VG/familiar), Arts. 169-172 CP (amenazas/coacciones), Arts. 178-189 CP (sexual/menores), Art. 202 CP (allanamiento), Arts. 234-245 CP (patrimonio), Arts. 248-263 CP (estafa/daños/usurpación), Arts. 298-299 CP (receptación), Arts. 368-370 CP (salud pública), Arts. 379-385 CP (seguridad vial), Arts. 390-401 CP (falsedades), Arts. 550-559 CP (orden público/atentado), entre otros.`;

/* ─── FACTORIES ─────────────────────────────────────────────────────────── */
const newAgent    = () => ({id:uid(), numero:""});
const newPatrulla = () => ({id:uid(), indicativo:"", ag1:"", ag2:"", ag3:""});
const newTraslado = () => ({id:uid(), indicativo:"", ag1:"", ag2:"", dest:"", destCustom:""});
const newPersona  = () => ({id:uid(), nombre:"", apellidos:"", hijosDe:"", tipoDoc:"DNI", doc:"", nacimiento:"", nacionalidad:"Española", domicilio:"", telefono:"", alegaciones:"", efectos:""});
const newTestigo  = () => ({id:uid(), nombre:"", apellidos:"", doc:"", domicilio:"", telefono:"", manifestacion:""});
const newVehiculo = () => ({id:uid(), matricula:"", marca:"", modelo:"", color:"", relacion:"Del autor"});
const newInfrac   = () => ({id:uid(), nDenuncia:"", denunciado:"", descripcion:""});
const newRol      = () => ({id:uid(), agente:"", rol:""});
const newDEC      = () => ({id:uid(), agente:"", ccp:"", disparos:"1", ciclos:"1", zona:"", v0:"Sí", estado:"", samur:"", cargas:[""]});

/* ─── PALETTE ───────────────────────────────────────────────────────────── */
const C = {
  bg:"#08111e", card:"#0f1f35", cardBorder:"#1e3a5f",
  gold:"#c9a84c", goldFaint:"#c9a84c16", goldHover:"#c9a84c2a",
  text:"#dde6f0", textMuted:"#607a94", textGold:"#dfc06a",
  iBg:"#070f1a", iBorder:"#1e3a5f", iFocus:"#c9a84c",
  red:"#c0392b", green:"#2d7a53", warn:"#1a1000", warnBorder:"#c9a84c88",
};

/* ─── MICRO-COMPONENTS ──────────────────────────────────────────────────── */
const lbl = {color:C.textMuted,fontSize:"10px",textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",display:"block",marginBottom:"5px"};
const iBase = {background:C.iBg,border:`1px solid ${C.iBorder}`,borderRadius:"5px",color:C.text,padding:"8px 11px",fontSize:"13px",outline:"none",width:"100%",fontFamily:"Georgia,serif",boxSizing:"border-box",transition:"border-color .15s,box-shadow .15s"};

function FInput({label,value,onChange,type="text",placeholder="X",style={}}) {
  return (
    <div style={style}>
      {label && <label style={lbl}>{label}</label>}
      <input type={type} value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)}
        onFocus={e=>{e.target.style.borderColor=C.iFocus;e.target.style.boxShadow=`0 0 0 2px ${C.gold}1a`;}}
        onBlur={e=>{e.target.style.borderColor=C.iBorder;e.target.style.boxShadow="none";}}
        style={iBase}/>
    </div>
  );
}
function FSelect({label,value,onChange,options,style={}}) {
  return (
    <div style={style}>
      {label && <label style={lbl}>{label}</label>}
      <select value={value} onChange={e=>onChange(e.target.value)}
        onFocus={e=>e.target.style.borderColor=C.iFocus}
        onBlur={e=>e.target.style.borderColor=C.iBorder}
        style={{...iBase,cursor:"pointer"}}>
        <option value="">— Seleccionar —</option>
        {options.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
}
function FTextArea({label,value,onChange,rows=3,placeholder="X",style={}}) {
  return (
    <div style={style}>
      {label && <label style={lbl}>{label}</label>}
      <textarea value={value} rows={rows} placeholder={placeholder} onChange={e=>onChange(e.target.value)}
        onFocus={e=>{e.target.style.borderColor=C.iFocus;e.target.style.boxShadow=`0 0 0 2px ${C.gold}1a`;}}
        onBlur={e=>{e.target.style.borderColor=C.iBorder;e.target.style.boxShadow="none";}}
        style={{...iBase,resize:"vertical"}}/>
    </div>
  );
}
function AddBtn({onClick,label,small=false}) {
  const [h,setH]=useState(false);
  return (
    <button onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
      style={{background:h?C.goldHover:"transparent",border:`1px dashed ${C.gold}`,color:C.gold,borderRadius:"6px",padding:small?"5px 11px":"7px 15px",fontSize:small?"10px":"11px",cursor:"pointer",fontFamily:"monospace",letterSpacing:"0.06em",transition:"background .15s",marginTop:"8px",display:"inline-flex",alignItems:"center",gap:"5px"}}>
      + {label}
    </button>
  );
}
function RemBtn({onClick}) {
  return (
    <button onClick={onClick} title="Eliminar"
      style={{background:"transparent",border:"none",color:C.red,cursor:"pointer",padding:"2px 7px",fontSize:"18px",lineHeight:1,flexShrink:0,borderRadius:"4px",opacity:.8}}>×</button>
  );
}
function Sec({title,icon,badge,children}) {
  return (
    <div style={{background:C.card,border:`1px solid ${C.cardBorder}`,borderRadius:"10px",marginBottom:"18px",overflow:"hidden"}}>
      <div style={{background:"linear-gradient(135deg,#152844,#0f1f35)",borderBottom:`1px solid ${C.cardBorder}`,padding:"13px 20px",display:"flex",alignItems:"center",gap:"10px"}}>
        <span style={{fontSize:"15px"}}>{icon}</span>
        <span style={{color:C.gold,fontWeight:"700",fontSize:"11px",letterSpacing:"0.13em",textTransform:"uppercase",fontFamily:"monospace"}}>{title}</span>
        {badge&&<span style={{marginLeft:"auto",background:C.goldFaint,color:C.gold,borderRadius:"20px",padding:"2px 10px",fontSize:"10px",fontFamily:"monospace"}}>{badge}</span>}
      </div>
      <div style={{padding:"18px 20px"}}>{children}</div>
    </div>
  );
}
function PersonaCard({persona,title,onChange,onRemove}) {
  const u=f=>v=>onChange({...persona,[f]:v});
  return (
    <div style={{background:C.iBg,border:`1px solid ${C.cardBorder}`,borderRadius:"7px",padding:"16px",marginBottom:"12px",animation:"fadeIn .25s ease"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"12px"}}>
        <span style={{color:C.textGold,fontSize:"11px",fontFamily:"monospace",fontWeight:"700",letterSpacing:"0.1em"}}>{title}</span>
        {onRemove&&<RemBtn onClick={onRemove}/>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
        <FInput label="Nombre" value={persona.nombre} onChange={u("nombre")}/>
        <FInput label="Apellidos" value={persona.apellidos} onChange={u("apellidos")}/>
        <FInput label="Hijo/a de (filiación opcional)" value={persona.hijosDe} onChange={u("hijosDe")} placeholder="Nombre padre y madre"/>
        <FSelect label="Tipo documento" value={persona.tipoDoc} onChange={u("tipoDoc")} options={TIPOS_DOC}/>
        <FInput label="Nº Documento" value={persona.doc} onChange={u("doc")}/>
        <FInput label="Fecha de nacimiento" value={persona.nacimiento} onChange={u("nacimiento")} type="date"/>
        <FSelect label="Nacionalidad" value={persona.nacionalidad} onChange={u("nacionalidad")} options={NACIONALIDADES}/>
        <FInput label="Domicilio" value={persona.domicilio} onChange={u("domicilio")}/>
        <FInput label="Teléfono" value={persona.telefono} onChange={u("telefono")}/>
      </div>
      <div style={{display:"grid",gap:"10px",marginTop:"10px"}}>
        <FTextArea label="Alegaciones / Manifestaciones" value={persona.alegaciones} onChange={u("alegaciones")} rows={2} placeholder="Lo que manifiesta espontáneamente ante los actuantes..."/>
        <FTextArea label="Efectos intervenidos" value={persona.efectos} onChange={u("efectos")} rows={2} placeholder="Sustancias, armas, documentación, dinero en metálico..."/>
      </div>
    </div>
  );
}

/* ─── FICHA BUILDER ─────────────────────────────────────────────────────── */
function buildFicha(s) {
  const f  = v => (v&&v.toString().trim()) ? v.toString().trim() : "X";
  const fd = d => { if(!d) return "X"; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
  const L  = [];
  const ln = t => L.push(t);

  ln("═══════════════════════════════════════════════════");
  ln("    FICHA DE ACTUACIÓN POLICIAL — DATOS");
  ln("═══════════════════════════════════════════════════");
  ln(""); ln("── DATOS DE LA ACTUACIÓN ──");
  ln(`  Fecha: ${fd(s.fecha)} | Hora: ${f(s.hora)} | Lugar exacto: ${f(s.lugar)}`);
  if(s.os) ln(`  Orden de Servicio nº: ${s.os}`);
  ln(""); ln("── AGENTES ACTUANTES ──");
  ln(`  Indicativo del furgón: ${f(s.indicativo)}`);
  s.agentes.forEach((a,i)=>ln(`  Agente ${i+1} · Nº Policial: ${f(a.numero)}`));
  if(s.patrullas.length){
    ln(""); ln("── PATRULLAS COLABORADORAS ──");
    s.patrullas.forEach((p,i)=>ln(`  Patrulla ${i+1} · Indicativo: ${f(p.indicativo)} | Agentes: ${f(p.ag1)}${p.ag2?", "+p.ag2:""}${p.ag3?", "+p.ag3:""}`));
  }
  if(s.traslados.length){
    ln(""); ln("── PATRULLA/S DE TRASLADO DEL/LOS DETENIDO/S ──");
    s.traslados.forEach((t,i)=>{
      const dest = t.dest==="Otro (escribir)" ? f(t.destCustom) : f(t.dest);
      ln(`  Traslado ${i+1} · Indicativo: ${f(t.indicativo)} | Agentes: ${f(t.ag1)}${t.ag2?", "+t.ag2:""} | Destino: ${dest}`);
    });
  }
  if(s.roles.length){
    ln(""); ln("── ROLES DE LOS AGENTES ──");
    s.roles.forEach(r=>ln(`  Nº ${f(r.agente)}: ${f(r.rol)}`));
  }
  if(s.incidencias){ ln(""); ln("── INCIDENCIAS DE LOS AGENTES ──"); ln(`  ${s.incidencias}`); }
  if(s.vehiculos.length){
    ln(""); ln("── VEHÍCULOS IMPLICADOS ──");
    s.vehiculos.forEach(v=>ln(`  Matrícula: ${f(v.matricula)} | ${f(v.marca)} ${f(v.modelo)} | Color: ${f(v.color)} | Relación: ${v.relacion}`));
  }
  if(s.autores.length){
    ln(""); ln("── AUTOR/ES (DETENIDO/S) ──");
    s.autores.forEach((a,i)=>{
      ln(`  Autor ${i+1}:`);
      ln(`    Nombre completo: ${f(a.nombre)} ${f(a.apellidos)}`);
      if(a.hijosDe) ln(`    Hijo/a de: ${a.hijosDe}`);
      ln(`    ${a.tipoDoc}: ${f(a.doc)}`);
      ln(`    Fecha nacimiento: ${fd(a.nacimiento)} | Nacionalidad: ${a.nacionalidad}`);
      ln(`    Domicilio: ${f(a.domicilio)} | Teléfono: ${f(a.telefono)}`);
      ln(`    Alegaciones: ${f(a.alegaciones)}`);
      ln(`    Efectos intervenidos: ${f(a.efectos)}`);
    });
  }
  if(s.victimas.length){
    ln(""); ln("── VÍCTIMA/S ──");
    s.victimas.forEach((v,i)=>{
      ln(`  Víctima ${i+1}:`);
      ln(`    Nombre completo: ${f(v.nombre)} ${f(v.apellidos)}`);
      ln(`    ${v.tipoDoc}: ${f(v.doc)}`);
      ln(`    Fecha nacimiento: ${fd(v.nacimiento)} | Nacionalidad: ${v.nacionalidad}`);
      ln(`    Domicilio: ${f(v.domicilio)} | Teléfono: ${f(v.telefono)}`);
      if(v.alegaciones) ln(`    Manifestación: ${v.alegaciones}`);
    });
  }
  if(s.testigos.length){
    ln(""); ln("── TESTIGOS ──");
    s.testigos.forEach((t,i)=>{
      ln(`  Testigo ${i+1}: ${f(t.nombre)} ${f(t.apellidos)} | DOC: ${f(t.doc)} | Dom: ${f(t.domicilio)} | Tel: ${f(t.telefono)}`);
      if(t.manifestacion) ln(`    Manifestación: ${t.manifestacion}`);
    });
  }
  ln(""); ln("── HECHOS ──");
  ln(`  Descripción: ${f(s.hechos)}`);
  if(s.danosFisicos) ln(`  Daños físicos: ${s.danosFisicos}`);
  if(s.danosMat) ln(`  Daños materiales: ${s.danosMat}`);
  if(s.infracciones.length){
    ln(""); ln("── INFRACCIONES ADMINISTRATIVAS ──");
    s.infracciones.forEach((x,i)=>ln(`  Infracción ${i+1} · Acta/Denuncia nº: ${f(x.nDenuncia)} | Denunciado: ${f(x.denunciado)} | Descripción: ${f(x.descripcion)}`));
  }
  const hasCust = s.custDerechos.activo||s.custEngrill.activo||s.custDroga.activo||s.custArma.activo||s.custDetenido.activo||s.custOtroEfecto.activo||s.custOtrosEfectos.activo;
  if(hasCust){
    ln(""); ln("── CUSTODIAS Y ACTUACIONES ──");
    if(s.custDerechos.activo)   ln(`  Lectura de derechos al detenido: Agente Nº ${f(s.custDerechos.agente)}`);
    if(s.custEngrill.activo)    ln(`  Engrilletamiento (${s.custEngrill.conResistencia?"CON resistencia":"SIN resistencia"}): Agente Nº ${f(s.custEngrill.agente)}`);
    if(s.custDroga.activo)      ln(`  Custodia de droga / sustancia: Agente Nº ${f(s.custDroga.agente)}`);
    if(s.custArma.activo)       ln(`  Custodia de arma: Agente Nº ${f(s.custArma.agente)}`);
    if(s.custDetenido.activo)   ln(`  Custodia del detenido: Agente Nº ${f(s.custDetenido.agente)}`);
    if(s.custOtroEfecto.activo) ln(`  Custodia de otro efecto (${f(s.custOtroEfecto.descripcion)}): Agente Nº ${f(s.custOtroEfecto.agente)}`);
    if(s.custOtrosEfectos.activo) ln(`  Otros efectos custodiados (${f(s.custOtrosEfectos.descripcion)}): Agente Nº ${f(s.custOtrosEfectos.agente)}`);
  }
  if(s.usaDEC && s.decDevices.length){
    ln(""); ln("── INTERVENCIÓN CON DEC (TASER T7) ──");
    s.decDevices.forEach((d,i)=>{
      ln(`  DEC ${i+1}:`);
      ln(`    Agente operador DEC: Nº ${f(d.agente)}`);
      ln(`    Código CCP: X${f(d.ccp)}`);
      ln(`    Disparos realizados: ${f(d.disparos)} | Ciclos NMI: ${f(d.ciclos)}`);
      ln(`    Zona de impacto: ${f(d.zona)}`);
      ln(`    Aviso previo a V-0: ${d.v0}`);
      ln(`    Resultado / Estado del sujeto: ${f(d.estado)}`);
      if(d.samur) ln(`    Asistencia SAMUR: ${d.samur}`);
      const cs = d.cargas.filter(c=>c.trim()).map(c=>`X${c}`).join(", ");
      ln(`    Números de serie de cargas usadas: ${cs||"X"}`);
    });
  }
  ln(""); ln("── CALIFICACIÓN Y ACTUACIÓN ──");
  const allDelitos = [...new Set([...s.delitosAI,...s.delitos])];
  ln(`  Posible delito: ${allDelitos.length ? allDelitos.join(" / ") : "X"}`);
  ln(`  Actuación policial: ${f(s.actuacion)}`);
  ln(`  Asistencia médica ofrecida: ${s.asistenciaOf}`);
  ln(`  Asistencia médica aceptada: ${s.asistenciaAc}`);
  return L.join("\n");
}

/* ─── MAIN APP ───────────────────────────────────────────────────────────── */
function App() {
  /* state — básicos */
  const [fecha,setFecha]=useState("");
  const [hora,setHora]=useState("");
  const [lugar,setLugar]=useState("");
  const [os,setOs]=useState("");
  const [indicativo,setIndicativo]=useState("");
  /* agentes */
  const [agentes,setAgentes]=useState([newAgent(),newAgent()]);
  /* patrullas */
  const [patrullas,setPatrullas]=useState([]);
  /* traslados — array para múltiples detenidos */
  const [traslados,setTraslados]=useState([newTraslado()]);
  /* roles e incidencias */
  const [roles,setRoles]=useState([]);
  const [incidencias,setIncidencias]=useState("");
  /* vehículos */
  const [vehiculos,setVehiculos]=useState([]);
  /* personas */
  const [autores,setAutores]=useState([newPersona()]);
  const [victimas,setVictimas]=useState([]);
  const [testigos,setTestigos]=useState([]);
  /* hechos */
  const [hechos,setHechos]=useState("");
  const [danosFisicos,setDanosFisicos]=useState("");
  const [danosMat,setDanosMat]=useState("");
  /* infracciones */
  const [infracciones,setInfracciones]=useState([]);
  /* custodias y actuaciones */
  const [custDerechos,setCustDerechos]=useState({activo:false,agente:""});
  const [custEngrill,setCustEngrill]=useState({activo:false,agente:"",conResistencia:false});
  const [custDroga,setCustDroga]=useState({activo:false,agente:""});
  const [custArma,setCustArma]=useState({activo:false,agente:""});
  const [custDetenido,setCustDetenido]=useState({activo:false,agente:""});
  const [custOtroEfecto,setCustOtroEfecto]=useState({activo:false,agente:"",descripcion:""});
  const [custOtrosEfectos,setCustOtrosEfectos]=useState({activo:false,agente:"",descripcion:""});
  /* DEC — array de dispositivos */
  const [usaDEC,setUsaDEC]=useState(false);
  const [decDevices,setDecDevices]=useState([newDEC()]);
  /* calificación */
  const [factsText,setFactsText]=useState("");
  const [delitosAI,setDelitosAI]=useState([]);
  const [delitosAIFull,setDelitosAIFull]=useState([]);
  const [isAnalyzing,setIsAnalyzing]=useState(false);
  const [analysisErr,setAnalysisErr]=useState("");
  const [delitos,setDelitos]=useState([]);
  const [actuacion,setActuacion]=useState("");
  const [asistenciaOf,setAsistenciaOf]=useState("Sí");
  const [asistenciaAc,setAsistenciaAc]=useState("No");
  /* ui */
  const [copied,setCopied]=useState(false);
  const [toast,setToast]=useState("");

  /* ── PERSISTENCIA EN CACHÉ DEL NAVEGADOR ── */
  // Cargar estado guardado al montar el componente
  useEffect(()=>{
    try{
      const saved=localStorage.getItem(STORAGE_KEY);
      if(!saved) return;
      const d=JSON.parse(saved);
      if(d.fecha!==undefined) setFecha(d.fecha);
      if(d.hora!==undefined) setHora(d.hora);
      if(d.lugar!==undefined) setLugar(d.lugar);
      if(d.os!==undefined) setOs(d.os);
      if(d.indicativo!==undefined) setIndicativo(d.indicativo);
      if(Array.isArray(d.agentes)&&d.agentes.length) setAgentes(d.agentes);
      if(Array.isArray(d.patrullas)) setPatrullas(d.patrullas);
      if(Array.isArray(d.traslados)&&d.traslados.length) setTraslados(d.traslados);
      if(Array.isArray(d.roles)) setRoles(d.roles);
      if(d.incidencias!==undefined) setIncidencias(d.incidencias);
      if(Array.isArray(d.vehiculos)) setVehiculos(d.vehiculos);
      if(Array.isArray(d.autores)&&d.autores.length) setAutores(d.autores);
      if(Array.isArray(d.victimas)) setVictimas(d.victimas);
      if(Array.isArray(d.testigos)) setTestigos(d.testigos);
      if(d.hechos!==undefined) setHechos(d.hechos);
      if(d.danosFisicos!==undefined) setDanosFisicos(d.danosFisicos);
      if(d.danosMat!==undefined) setDanosMat(d.danosMat);
      if(Array.isArray(d.infracciones)) setInfracciones(d.infracciones);
      if(d.custDerechos) setCustDerechos(d.custDerechos);
      if(d.custEngrill) setCustEngrill(d.custEngrill);
      if(d.custDroga) setCustDroga(d.custDroga);
      if(d.custArma) setCustArma(d.custArma);
      if(d.custDetenido) setCustDetenido(d.custDetenido);
      if(d.custOtroEfecto) setCustOtroEfecto(d.custOtroEfecto);
      if(d.custOtrosEfectos) setCustOtrosEfectos(d.custOtrosEfectos);
      if(d.usaDEC!==undefined) setUsaDEC(d.usaDEC);
      if(Array.isArray(d.decDevices)&&d.decDevices.length) setDecDevices(d.decDevices);
      if(d.factsText!==undefined) setFactsText(d.factsText);
      if(Array.isArray(d.delitosAI)) setDelitosAI(d.delitosAI);
      if(Array.isArray(d.delitosAIFull)) setDelitosAIFull(d.delitosAIFull);
      if(Array.isArray(d.delitos)) setDelitos(d.delitos);
      if(d.actuacion!==undefined) setActuacion(d.actuacion);
      if(d.asistenciaOf!==undefined) setAsistenciaOf(d.asistenciaOf);
      if(d.asistenciaAc!==undefined) setAsistenciaAc(d.asistenciaAc);
    }catch(e){ console.warn("PMM: error al cargar caché",e); }
  },[]);

  // Guardar automáticamente en localStorage en cada cambio
  useEffect(()=>{
    try{
      const data={fecha,hora,lugar,os,indicativo,agentes,patrullas,traslados,roles,incidencias,vehiculos,autores,victimas,testigos,hechos,danosFisicos,danosMat,infracciones,custDerechos,custEngrill,custDroga,custArma,custDetenido,custOtroEfecto,custOtrosEfectos,usaDEC,decDevices,factsText,delitosAI,delitosAIFull,delitos,actuacion,asistenciaOf,asistenciaAc};
      localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    }catch(e){ console.warn("PMM: error al guardar caché",e); }
  },[fecha,hora,lugar,os,indicativo,agentes,patrullas,traslados,roles,incidencias,vehiculos,autores,victimas,testigos,hechos,danosFisicos,danosMat,infracciones,custDerechos,custEngrill,custDroga,custArma,custDetenido,custOtroEfecto,custOtrosEfectos,usaDEC,decDevices,factsText,delitosAI,delitosAIFull,delitos,actuacion,asistenciaOf,asistenciaAc]);

  /* ── handlers helpers ── */
  const showToast = t => { setToast(t); setTimeout(()=>setToast(""),3000); };

  /* agentes */
  const addAg=()=>setAgentes(a=>[...a,newAgent()]);
  const remAg=id=>setAgentes(a=>a.filter(x=>x.id!==id));
  const updAg=(id,v)=>setAgentes(a=>a.map(x=>x.id===id?{...x,numero:v}:x));
  /* patrullas */
  const addPat=()=>setPatrullas(p=>[...p,newPatrulla()]);
  const remPat=id=>setPatrullas(p=>p.filter(x=>x.id!==id));
  const updPat=(id,f,v)=>setPatrullas(p=>p.map(x=>x.id===id?{...x,[f]:v}:x));
  /* traslados */
  const addTras=()=>setTraslados(t=>[...t,newTraslado()]);
  const remTras=id=>setTraslados(t=>t.filter(x=>x.id!==id));
  const updTras=(id,f,v)=>setTraslados(t=>t.map(x=>x.id===id?{...x,[f]:v}:x));
  /* roles */
  const addRol=()=>setRoles(r=>[...r,newRol()]);
  const remRol=id=>setRoles(r=>r.filter(x=>x.id!==id));
  const updRol=(id,f,v)=>setRoles(rs=>rs.map(x=>x.id===id?{...x,[f]:v}:x));
  /* vehiculos */
  const addVeh=()=>setVehiculos(v=>[...v,newVehiculo()]);
  const remVeh=id=>setVehiculos(v=>v.filter(x=>x.id!==id));
  const updVeh=(id,f,v)=>setVehiculos(vs=>vs.map(x=>x.id===id?{...x,[f]:v}:x));
  /* personas */
  const addAut=()=>setAutores(a=>[...a,newPersona()]);
  const remAut=id=>setAutores(a=>a.filter(x=>x.id!==id));
  const updAut=(id,v)=>setAutores(a=>a.map(x=>x.id===id?v:x));
  const addVic=()=>setVictimas(v=>[...v,newPersona()]);
  const remVic=id=>setVictimas(v=>v.filter(x=>x.id!==id));
  const updVic=(id,v)=>setVictimas(vs=>vs.map(x=>x.id===id?v:x));
  const addTes=()=>setTestigos(t=>[...t,newTestigo()]);
  const remTes=id=>setTestigos(t=>t.filter(x=>x.id!==id));
  const updTes=(id,f,v)=>setTestigos(ts=>ts.map(x=>x.id===id?{...x,[f]:v}:x));
  /* infracciones */
  const addInf=()=>setInfracciones(i=>[...i,newInfrac()]);
  const remInf=id=>setInfracciones(i=>i.filter(x=>x.id!==id));
  const updInf=(id,f,v)=>setInfracciones(is=>is.map(x=>x.id===id?{...x,[f]:v}:x));
  /* DEC */
  const addDEC=()=>setDecDevices(d=>[...d,newDEC()]);
  const remDEC=id=>setDecDevices(d=>d.filter(x=>x.id!==id));
  const updDEC=(id,f,v)=>setDecDevices(ds=>ds.map(x=>x.id===id?{...x,[f]:v}:x));
  const addCarga=devId=>setDecDevices(ds=>ds.map(d=>d.id===devId?{...d,cargas:[...d.cargas,""]}:d));
  const remCarga=(devId,ci)=>setDecDevices(ds=>ds.map(d=>d.id===devId?{...d,cargas:d.cargas.filter((_,i)=>i!==ci)}:d));
  const updCarga=(devId,ci,v)=>setDecDevices(ds=>ds.map(d=>d.id===devId?{...d,cargas:d.cargas.map((c,i)=>i===ci?v:c)}:d));
  /* delitos manual */
  const toggleDelito=d=>setDelitos(prev=>prev.includes(d)?prev.filter(x=>x!==d):[...prev,d]);

  /* ── AI crime suggestion ── */
  const suggestCrimes = async () => {
    if(!factsText.trim()){ showToast("⚠ Describe primero los hechos"); return; }
    setIsAnalyzing(true); setAnalysisErr(""); setDelitosAI([]); setDelitosAIFull([]);
    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:1000,
          system: CRIME_SYSTEM_PROMPT,
          messages:[{role:"user",content:`Hechos: ${factsText}\n\nIdentifica TODOS los posibles delitos aplicables incluyendo concurso si procede.`}]
        })
      });
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message);
      const txt = data.content.map(i=>i.type==="text"?i.text:"").join("");
      const clean = txt.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      const arr = parsed.delitos || [];
      setDelitosAIFull(arr);
      setDelitosAI(arr.map(d=>`${d.articulo} — ${d.tipo}`));
    } catch(e) {
      setAnalysisErr("Error al analizar: "+e.message);
    }
    setIsAnalyzing(false);
  };

  /* ── limpiar formulario ── */
  const limpiar=()=>{
    if(!window.confirm('¿Limpiar todos los campos y empezar una nueva intervención?\n\nEsta acción no se puede deshacer.')) return;
    localStorage.removeItem(STORAGE_KEY);
    setFecha(""); setHora(""); setLugar(""); setOs(""); setIndicativo("");
    setAgentes([newAgent(),newAgent()]); setPatrullas([]); setTraslados([newTraslado()]);
    setRoles([]); setIncidencias(""); setVehiculos([]);
    setAutores([newPersona()]); setVictimas([]); setTestigos([]);
    setHechos(""); setDanosFisicos(""); setDanosMat(""); setInfracciones([]);
    setCustDerechos({activo:false,agente:""});
    setCustEngrill({activo:false,agente:"",conResistencia:false});
    setCustDroga({activo:false,agente:""}); setCustArma({activo:false,agente:""});
    setCustDetenido({activo:false,agente:""});
    setCustOtroEfecto({activo:false,agente:"",descripcion:""});
    setCustOtrosEfectos({activo:false,agente:"",descripcion:""});
    setUsaDEC(false); setDecDevices([newDEC()]);
    setFactsText(""); setDelitosAI([]); setDelitosAIFull([]); setAnalysisErr(""); setDelitos([]);
    setActuacion(""); setAsistenciaOf("Sí"); setAsistenciaAc("No");
    setCopied(false);
    showToast("✓ Formulario limpiado — listo para nueva intervención");
  };

  /* ── copy ficha ── */
  const getState=()=>({fecha,hora,lugar,os,indicativo,agentes,patrullas,traslados,roles,incidencias,vehiculos,autores,victimas,testigos,hechos,danosFisicos,danosMat,infracciones,custDerechos,custEngrill,custDroga,custArma,custDetenido,custOtroEfecto,custOtrosEfectos,usaDEC,decDevices,delitosAI,delitos,actuacion,asistenciaOf,asistenciaAc});
  const copyFicha=()=>{
    const txt=buildFicha(getState());
    navigator.clipboard.writeText(txt).then(()=>{
      setCopied(true); showToast("✓ Ficha copiada — pégala en el chat para generar la comparecencia");
      setTimeout(()=>setCopied(false),3200);
    }).catch(()=>showToast("⚠ No se pudo copiar. Usa CTRL+C en la vista previa."));
  };

  const isTraslado = actuacion==="Traslado a dependencias para identificación (Art. 16 LO 4/2015)";

  /* ────────────────────────── RENDER ───────────────────────────────────── */
  return (
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"Georgia,'Times New Roman',serif",color:C.text}}>

      {/* ── TOAST ── */}
      {toast&&<div style={{position:"fixed",top:"68px",left:"50%",transform:"translateX(-50%)",background:C.green,color:"#fff",borderRadius:"8px",padding:"10px 22px",fontFamily:"monospace",fontSize:"12px",zIndex:600,boxShadow:"0 4px 20px #00000099",letterSpacing:"0.05em",whiteSpace:"nowrap",animation:"toastIn .25s ease"}}>{toast}</div>}

      {/* ── HEADER ── */}
      <div style={{background:"linear-gradient(135deg,#0c1e38,#08111e)",borderBottom:`2px solid ${C.gold}`,padding:"14px 28px",display:"flex",alignItems:"center",gap:"14px",position:"sticky",top:0,zIndex:100,boxShadow:"0 4px 28px #00000099"}}>
        <span style={{fontSize:"22px"}}>🚔</span>
        <div>
          <div style={{color:C.gold,fontFamily:"monospace",fontWeight:"700",fontSize:"12px",letterSpacing:"0.18em"}}>POLICÍA MUNICIPAL DE MADRID</div>
          <div style={{color:C.textMuted,fontFamily:"monospace",fontSize:"10px",letterSpacing:"0.1em",marginTop:"2px"}}>SISTEMA DE COMPARECENCIAS · COMISARÍA CENTRAL DE SEGURIDAD</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:"10px",alignItems:"center"}}>
          <span style={{color:"#2e6644",fontFamily:"monospace",fontSize:"10px",letterSpacing:"0.06em",opacity:.8}}>💾 guardado automáticamente</span>
          <button onClick={limpiar}
            style={{background:"transparent",color:"#c0392b",border:"1px solid #c0392b55",borderRadius:"7px",padding:"9px 18px",fontFamily:"monospace",fontWeight:"700",fontSize:"12px",cursor:"pointer",letterSpacing:"0.08em",transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="#c0392b22";}}
            onMouseLeave={e=>{e.currentTarget.style.background="transparent";}}>
            🗑 LIMPIAR
          </button>
          <button onClick={copyFicha}
            style={{background:copied?C.green:`linear-gradient(135deg,${C.gold},#e8c87a)`,color:"#08111e",border:"none",borderRadius:"7px",padding:"10px 22px",fontFamily:"monospace",fontWeight:"700",fontSize:"12px",cursor:"pointer",letterSpacing:"0.08em",boxShadow:copied?"none":`0 3px 14px ${C.gold}44`,transition:"all .25s"}}>
            {copied?"✓ FICHA COPIADA":"📋 COPIAR FICHA"}
          </button>
        </div>
      </div>

      <div style={{maxWidth:"930px",margin:"0 auto",padding:"24px 18px 70px"}}>

        {/* ── 1. DATOS DE LA ACTUACIÓN ── */}
        <Sec title="Datos de la Actuación" icon="📋">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr 1fr",gap:"12px"}}>
            <FInput label="Fecha" value={fecha} onChange={setFecha} type="date"/>
            <FInput label="Hora (HH:MM)" value={hora} onChange={setHora} placeholder="HH:MM"/>
            <FInput label="Lugar exacto" value={lugar} onChange={setLugar} placeholder="Calle / número / municipio"/>
            <FInput label="Orden de Servicio" value={os} onChange={setOs} placeholder="Nº/AAAA"/>
          </div>
        </Sec>

        {/* ── 2. AGENTES ACTUANTES ── */}
        <Sec title="Agentes Actuantes" icon="👮" badge={`${agentes.length} AGENTE${agentes.length!==1?"S":""}`}>
          <FInput label="Indicativo del furgón" value={indicativo} onChange={setIndicativo} placeholder="Ej: 5-A-12"/>
          <div style={{marginTop:"14px",display:"grid",gap:"8px"}}>
            {agentes.map((a,i)=>(
              <div key={a.id} style={{display:"flex",gap:"8px",alignItems:"flex-end"}}>
                <FInput label={`Agente ${i+1} — Nº Policial`} value={a.numero} onChange={v=>updAg(a.id,v)} placeholder="Ej: 12345" style={{flex:1}}/>
                {agentes.length>1&&<RemBtn onClick={()=>remAg(a.id)}/>}
              </div>
            ))}
          </div>
          <AddBtn onClick={addAg} label="Añadir agente"/>
        </Sec>

        {/* ── 3. PATRULLAS COLABORADORAS ── */}
        <Sec title="Patrullas Colaboradoras" icon="🚔" badge={patrullas.length?`${patrullas.length} PATRULLA${patrullas.length>1?"S":""}` :"OPCIONAL"}>
          {patrullas.map((p,i)=>(
            <div key={p.id} style={{background:C.iBg,border:`1px solid ${C.cardBorder}`,borderRadius:"7px",padding:"14px",marginBottom:"10px",animation:"fadeIn .2s ease"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"10px"}}>
                <span style={{color:C.textGold,fontSize:"11px",fontFamily:"monospace",letterSpacing:"0.1em"}}>PATRULLA {i+1}</span>
                <RemBtn onClick={()=>remPat(p.id)}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:"8px"}}>
                <FInput label="Indicativo" value={p.indicativo} onChange={v=>updPat(p.id,"indicativo",v)}/>
                <FInput label="Agente 1" value={p.ag1} onChange={v=>updPat(p.id,"ag1",v)}/>
                <FInput label="Agente 2" value={p.ag2} onChange={v=>updPat(p.id,"ag2",v)}/>
                <FInput label="Agente 3" value={p.ag3} onChange={v=>updPat(p.id,"ag3",v)}/>
              </div>
            </div>
          ))}
          <AddBtn onClick={addPat} label="Añadir patrulla colaboradora"/>
        </Sec>

        {/* ── 4. TRASLADO DEL DETENIDO — múltiple ── */}
        <Sec title="Patrulla/s de Traslado del Detenido" icon="🚗" badge={traslados.length>1?`${traslados.length} TRASLADOS`:undefined}>
          {traslados.map((t,i)=>(
            <div key={t.id} style={{background:C.iBg,border:`1px solid ${C.cardBorder}`,borderRadius:"7px",padding:"14px",marginBottom:"10px",animation:"fadeIn .2s ease"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
                <span style={{color:C.textGold,fontSize:"11px",fontFamily:"monospace",fontWeight:"700",letterSpacing:"0.1em"}}>TRASLADO {i+1} {i>0?"— DETENIDO/A ADICIONAL":""}</span>
                {traslados.length>1&&<RemBtn onClick={()=>remTras(t.id)}/>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr",gap:"10px"}}>
                <FInput label="Indicativo" value={t.indicativo} onChange={v=>updTras(t.id,"indicativo",v)}/>
                <FInput label="Agente 1 (Nº Pol.)" value={t.ag1} onChange={v=>updTras(t.id,"ag1",v)}/>
                <FInput label="Agente 2 (Nº Pol.)" value={t.ag2} onChange={v=>updTras(t.id,"ag2",v)}/>
              </div>
              <div style={{marginTop:"10px"}}>
                <FSelect label="Destino" value={t.dest} onChange={v=>updTras(t.id,"dest",v)} options={DESTINOS}/>
                {t.dest==="Otro (escribir)"&&(
                  <div style={{marginTop:"8px",animation:"fadeIn .2s ease"}}>
                    <FInput label="Especifique el destino" value={t.destCustom} onChange={v=>updTras(t.id,"destCustom",v)} placeholder="Nombre y dirección del destino"/>
                  </div>
                )}
              </div>
            </div>
          ))}
          <AddBtn onClick={addTras} label="Añadir traslado (otro detenido/a)"/>
        </Sec>

        {/* ── 5. ROLES E INCIDENCIAS ── */}
        <Sec title="Roles e Incidencias de Agentes" icon="🔧">
          {roles.map((r,i)=>(
            <div key={r.id} style={{display:"grid",gridTemplateColumns:"1fr 2fr auto",gap:"8px",alignItems:"flex-end",marginBottom:"8px"}}>
              <FInput label={`Agente ${i+1} — Nº Policial`} value={r.agente} onChange={v=>updRol(r.id,"agente",v)}/>
              <FInput label="Rol / Función en la actuación" value={r.rol} onChange={v=>updRol(r.id,"rol",v)} placeholder="Ej: Entrevista autor, cacheo, lectura derechos..."/>
              <RemBtn onClick={()=>remRol(r.id)}/>
            </div>
          ))}
          <AddBtn onClick={addRol} label="Añadir rol de agente"/>
          <div style={{marginTop:"14px"}}>
            <FTextArea label="Incidencias de los agentes (lesiones sufridas, objetos dañados)" value={incidencias} onChange={setIncidencias} rows={2} placeholder="Ej: El agente con Nº X sufre contusión en..."/>
          </div>
        </Sec>

        {/* ── 6. VEHÍCULOS ── */}
        <Sec title="Vehículos Implicados" icon="🚙" badge={vehiculos.length?`${vehiculos.length}`:"OPCIONAL"}>
          {vehiculos.map((v,i)=>(
            <div key={v.id} style={{background:C.iBg,border:`1px solid ${C.cardBorder}`,borderRadius:"7px",padding:"14px",marginBottom:"10px",animation:"fadeIn .2s ease"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"8px"}}>
                <span style={{color:C.textGold,fontSize:"11px",fontFamily:"monospace",letterSpacing:"0.1em"}}>VEHÍCULO {i+1}</span>
                <RemBtn onClick={()=>remVeh(v.id)}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 2fr",gap:"8px"}}>
                <FInput label="Matrícula" value={v.matricula} onChange={val=>updVeh(v.id,"matricula",val)}/>
                <FInput label="Marca" value={v.marca} onChange={val=>updVeh(v.id,"marca",val)}/>
                <FInput label="Modelo" value={v.modelo} onChange={val=>updVeh(v.id,"modelo",val)}/>
                <FInput label="Color" value={v.color} onChange={val=>updVeh(v.id,"color",val)}/>
                <FSelect label="Relación con el caso" value={v.relacion} onChange={val=>updVeh(v.id,"relacion",val)} options={RELACION_VEH}/>
              </div>
            </div>
          ))}
          <AddBtn onClick={addVeh} label="Añadir vehículo"/>
        </Sec>

        {/* ── 7. AUTOR/ES ── */}
        <Sec title="Autor / es — Detenido / s" icon="🔒" badge={`${autores.length}`}>
          {autores.map((a,i)=>(
            <PersonaCard key={a.id} persona={a} title={`AUTOR ${i+1}`}
              onChange={v=>updAut(a.id,v)}
              onRemove={autores.length>1?()=>remAut(a.id):null}/>
          ))}
          <AddBtn onClick={addAut} label="Añadir autor / detenido"/>
        </Sec>

        {/* ── 8. VÍCTIMAS ── */}
        <Sec title="Víctima / s" icon="🙍" badge={victimas.length?`${victimas.length}`:"OPCIONAL"}>
          {victimas.map((v,i)=>(
            <PersonaCard key={v.id} persona={v} title={`VÍCTIMA ${i+1}`}
              onChange={val=>updVic(v.id,val)}
              onRemove={()=>remVic(v.id)}/>
          ))}
          <AddBtn onClick={addVic} label="Añadir víctima / perjudicado"/>
        </Sec>

        {/* ── 9. TESTIGOS ── */}
        <Sec title="Testigos" icon="👁" badge={testigos.length?`${testigos.length}`:"OPCIONAL"}>
          {testigos.map((t,i)=>(
            <div key={t.id} style={{background:C.iBg,border:`1px solid ${C.cardBorder}`,borderRadius:"7px",padding:"14px",marginBottom:"10px",animation:"fadeIn .2s ease"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"10px"}}>
                <span style={{color:C.textGold,fontSize:"11px",fontFamily:"monospace",letterSpacing:"0.1em"}}>TESTIGO {i+1}</span>
                <RemBtn onClick={()=>remTes(t.id)}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:"8px",marginBottom:"8px"}}>
                <FInput label="Nombre" value={t.nombre} onChange={v=>updTes(t.id,"nombre",v)}/>
                <FInput label="Apellidos" value={t.apellidos} onChange={v=>updTes(t.id,"apellidos",v)}/>
                <FInput label="DNI/NIE" value={t.doc} onChange={v=>updTes(t.id,"doc",v)}/>
                <FInput label="Domicilio" value={t.domicilio} onChange={v=>updTes(t.id,"domicilio",v)}/>
                <FInput label="Teléfono" value={t.telefono} onChange={v=>updTes(t.id,"telefono",v)}/>
              </div>
              <FTextArea label="Manifestación del testigo" value={t.manifestacion} onChange={v=>updTes(t.id,"manifestacion",v)} rows={2}/>
            </div>
          ))}
          <AddBtn onClick={addTes} label="Añadir testigo"/>
        </Sec>

        {/* ── 10. HECHOS ── */}
        <Sec title="Hechos" icon="📝">
          <FTextArea label="Descripción de los hechos" value={hechos} onChange={setHechos} rows={5} placeholder="Relato detallado de los hechos ocurridos..."/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginTop:"12px"}}>
            <FTextArea label="Daños físicos (personas)" value={danosFisicos} onChange={setDanosFisicos} rows={2} placeholder="Lesiones sufridas, asistencia sanitaria..."/>
            <FTextArea label="Daños materiales (bienes)" value={danosMat} onChange={setDanosMat} rows={2} placeholder="Daños en vehículos, propiedades..."/>
          </div>
        </Sec>

        {/* ── 11. INFRACCIONES ADMINISTRATIVAS ── */}
        <Sec title="Infracciones Administrativas" icon="📋" badge={infracciones.length?`${infracciones.length}`:"OPCIONAL"}>
          {infracciones.map((x,i)=>(
            <div key={x.id} style={{background:C.iBg,border:`1px solid ${C.cardBorder}`,borderRadius:"7px",padding:"14px",marginBottom:"10px",animation:"fadeIn .2s ease"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"8px"}}>
                <span style={{color:C.textGold,fontSize:"11px",fontFamily:"monospace",letterSpacing:"0.1em"}}>INFRACCIÓN {i+1}</span>
                <RemBtn onClick={()=>remInf(x.id)}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"8px"}}>
                <FInput label="Nº Acta / Denuncia" value={x.nDenuncia} onChange={v=>updInf(x.id,"nDenuncia",v)}/>
                <FInput label="Denunciado" value={x.denunciado} onChange={v=>updInf(x.id,"denunciado",v)}/>
              </div>
              <FTextArea label="Descripción de la infracción" value={x.descripcion} onChange={v=>updInf(x.id,"descripcion",v)} rows={2}/>
            </div>
          ))}
          <AddBtn onClick={addInf} label="Añadir infracción administrativa"/>
        </Sec>

        {/* ── 12. CUSTODIAS Y ACTUACIONES ── */}
        <Sec title="Custodias y Actuaciones" icon="📦">
          <div style={{display:"grid",gap:"6px"}}>

            {/* Fila helper */}
            {[
              {key:"derechos",  label:"Lee los derechos al detenido",  st:custDerechos,  set:setCustDerechos,  extra:null},
              {key:"engrill",   label:"Engrilletamiento",               st:custEngrill,   set:setCustEngrill,   extra:"resistencia"},
              {key:"droga",     label:"Custodia de droga / sustancia",  st:custDroga,     set:setCustDroga,     extra:null},
              {key:"arma",      label:"Custodia de arma",               st:custArma,      set:setCustArma,      extra:null},
              {key:"detenido",  label:"Custodia del detenido",          st:custDetenido,  set:setCustDetenido,  extra:null},
              {key:"otroEf",    label:"Custodia de otro efecto",        st:custOtroEfecto,set:setCustOtroEfecto,extra:"desc"},
              {key:"otrosEfs",  label:"Otros efectos custodiados",      st:custOtrosEfectos,set:setCustOtrosEfectos,extra:"desc"},
            ].map(row=>(
              <div key={row.key} style={{background:row.st.activo?"#0d1e30":C.iBg,border:`1px solid ${row.st.activo?C.gold+"55":C.cardBorder}`,borderRadius:"7px",padding:"12px 14px",transition:"all .2s"}}>
                <div style={{display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap"}}>
                  <label style={{display:"flex",alignItems:"center",gap:"8px",cursor:"pointer",minWidth:"240px"}}>
                    <input type="checkbox" checked={row.st.activo} onChange={e=>row.set(s=>({...s,activo:e.target.checked}))}
                      style={{width:"16px",height:"16px",accentColor:C.gold,cursor:"pointer",flexShrink:0}}/>
                    <span style={{color:row.st.activo?C.text:C.textMuted,fontSize:"13px",transition:"color .2s"}}>{row.label}</span>
                  </label>
                  {row.st.activo&&(
                    <div style={{display:"flex",alignItems:"center",gap:"8px",flex:1,minWidth:"180px",animation:"fadeIn .2s ease"}}>
                      <span style={{color:C.textMuted,fontFamily:"monospace",fontSize:"10px",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:"0.08em"}}>Nº Policial:</span>
                      <input value={row.st.agente} placeholder="Ej: 12345"
                        onChange={e=>row.set(s=>({...s,agente:e.target.value}))}
                        onFocus={e=>{e.target.style.borderColor=C.iFocus;}}
                        onBlur={e=>{e.target.style.borderColor=C.iBorder;}}
                        style={{...iBase,maxWidth:"140px",padding:"6px 10px",fontSize:"13px"}}/>
                    </div>
                  )}
                </div>
                {row.st.activo&&row.extra==="resistencia"&&(
                  <div style={{marginTop:"10px",marginLeft:"24px",display:"flex",gap:"20px",animation:"fadeIn .2s ease"}}>
                    <label style={{display:"flex",alignItems:"center",gap:"6px",cursor:"pointer"}}>
                      <input type="radio" name="resistencia" checked={!row.st.conResistencia}
                        onChange={()=>row.set(s=>({...s,conResistencia:false}))}
                        style={{accentColor:C.gold,cursor:"pointer"}}/>
                      <span style={{color:C.text,fontSize:"13px"}}>Sin resistencia</span>
                    </label>
                    <label style={{display:"flex",alignItems:"center",gap:"6px",cursor:"pointer"}}>
                      <input type="radio" name="resistencia" checked={row.st.conResistencia}
                        onChange={()=>row.set(s=>({...s,conResistencia:true}))}
                        style={{accentColor:C.gold,cursor:"pointer"}}/>
                      <span style={{color:C.text,fontSize:"13px"}}>Con resistencia</span>
                    </label>
                  </div>
                )}
                {row.st.activo&&row.extra==="desc"&&(
                  <div style={{marginTop:"10px",marginLeft:"24px",animation:"fadeIn .2s ease"}}>
                    <input value={row.st.descripcion} placeholder="Descripción del efecto custodiado..."
                      onChange={e=>row.set(s=>({...s,descripcion:e.target.value}))}
                      onFocus={e=>{e.target.style.borderColor=C.iFocus;}}
                      onBlur={e=>{e.target.style.borderColor=C.iBorder;}}
                      style={{...iBase,fontSize:"13px"}}/>
                  </div>
                )}
              </div>
            ))}

          </div>
        </Sec>

        {/* ── 13. DEC — múltiples dispositivos ── */}
        <Sec title="Intervención con DEC — Taser T7" icon="⚡" badge={usaDEC?`${decDevices.length} DISPOSITIVO${decDevices.length>1?"S":""}`:undefined}>
          <label style={{display:"flex",alignItems:"center",gap:"10px",cursor:"pointer",marginBottom:"16px"}}>
            <input type="checkbox" checked={usaDEC} onChange={e=>setUsaDEC(e.target.checked)}
              style={{width:"17px",height:"17px",accentColor:C.gold,cursor:"pointer"}}/>
            <span style={{fontSize:"14px",color:C.text}}>Se ha utilizado el Dispositivo Electrónico de Control</span>
          </label>
          {usaDEC&&(
            <div style={{animation:"fadeIn .2s ease"}}>
              {decDevices.map((d,i)=>(
                <div key={d.id} style={{background:C.iBg,border:`1px solid #2a3e5e`,borderRadius:"8px",padding:"16px",marginBottom:"14px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
                    <span style={{color:"#f5c842",fontSize:"11px",fontFamily:"monospace",fontWeight:"700",letterSpacing:"0.12em"}}>⚡ DISPOSITIVO DEC {i+1}</span>
                    {decDevices.length>1&&<RemBtn onClick={()=>remDEC(d.id)}/>}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"10px"}}>
                    <FInput label="Nº Policial del agente operador" value={d.agente} onChange={v=>updDEC(d.id,"agente",v)}/>
                    <FInput label="Código CCP (sin prefijo X)" value={d.ccp} onChange={v=>updDEC(d.id,"ccp",v)} placeholder="Número tras el prefijo X"/>
                    <FInput label="Disparos realizados" value={d.disparos} onChange={v=>updDEC(d.id,"disparos",v)} placeholder="1"/>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"10px"}}>
                    <FInput label="Ciclos NMI activados" value={d.ciclos} onChange={v=>updDEC(d.id,"ciclos",v)} placeholder="1"/>
                    <FSelect label="Zona de impacto de los dardos" value={d.zona} onChange={v=>updDEC(d.id,"zona",v)} options={ZONAS_IMPACTO}/>
                    <FSelect label="Aviso previo a Vector-0 (V-0)" value={d.v0} onChange={v=>updDEC(d.id,"v0",v)} options={["Sí","No"]}/>
                  </div>
                  <div style={{marginBottom:"10px"}}>
                    <FSelect label="Resultado / Estado del sujeto" value={d.estado} onChange={v=>updDEC(d.id,"estado",v)} options={ESTADOS_DEC}/>
                  </div>
                  <div style={{marginBottom:"12px"}}>
                    <FTextArea label="Asistencia SAMUR (indicativo, resultado)" value={d.samur} onChange={v=>updDEC(d.id,"samur",v)} rows={2} placeholder="Indicativo SAMUR, resultado de la asistencia, traslado/alta..."/>
                  </div>
                  {/* Cargas — múltiples */}
                  <div style={{background:"#060d18",border:`1px solid #1a2e48`,borderRadius:"6px",padding:"12px"}}>
                    <label style={{...lbl,marginBottom:"10px",color:"#8ab"}}>NÚMEROS DE SERIE DE CARGAS USADAS (sin prefijo X)</label>
                    {d.cargas.map((c,ci)=>(
                      <div key={ci} style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"7px"}}>
                        <span style={{color:C.textMuted,fontFamily:"monospace",fontSize:"12px",minWidth:"14px"}}>X</span>
                        <input value={c} placeholder={"número de serie"} onChange={e=>updCarga(d.id,ci,e.target.value)}
                          onFocus={e=>{e.target.style.borderColor=C.iFocus;}}
                          onBlur={e=>{e.target.style.borderColor=C.iBorder;}}
                          style={{...iBase,flex:1}}/>
                        {d.cargas.length>1&&<RemBtn onClick={()=>remCarga(d.id,ci)}/>}
                      </div>
                    ))}
                    <AddBtn onClick={()=>addCarga(d.id)} label="Añadir carga" small={true}/>
                  </div>
                </div>
              ))}
              <AddBtn onClick={addDEC} label="Añadir dispositivo DEC adicional"/>
            </div>
          )}
        </Sec>

        {/* ── 13. CALIFICACIÓN Y ACTUACIÓN ── */}
        <Sec title="Calificación y Actuación Policial" icon="⚖">

          {/* — Análisis IA de hechos — */}
          <div style={{background:C.iBg,border:`1px solid ${C.cardBorder}`,borderRadius:"8px",padding:"16px",marginBottom:"18px"}}>
            <label style={{...lbl,color:C.textGold,marginBottom:"8px"}}>🔍 Análisis jurídico automático de los hechos</label>
            <FTextArea label="Describe brevemente los hechos para análisis" value={factsText} onChange={setFactsText} rows={3} placeholder="Ej: Se observa a un individuo vendiendo papelinas de cocaína en la vía pública, portando además una navaja automática..."/>
            <button onClick={suggestCrimes} disabled={isAnalyzing}
              style={{background:isAnalyzing?"#222":`linear-gradient(135deg,#1a3a6a,#1e4a8a)`,color:isAnalyzing?"#555":"#a8d0f0",border:`1px solid #2a5a9a`,borderRadius:"6px",padding:"9px 20px",fontFamily:"monospace",fontSize:"12px",cursor:isAnalyzing?"not-allowed":"pointer",letterSpacing:"0.08em",marginTop:"10px",transition:"all .2s"}}>
              {isAnalyzing?"⟳  Analizando hechos...":"🔍  Sugerir posibles delitos automáticamente"}
            </button>

            {/* Resultado IA */}
            {(delitosAIFull.length>0||analysisErr)&&(
              <div style={{marginTop:"14px",animation:"fadeIn .3s ease"}}>
                {analysisErr&&<div style={{color:"#e88",fontFamily:"monospace",fontSize:"12px",padding:"8px",background:"#1a0000",borderRadius:"5px",border:"1px solid #c03"}}>{analysisErr}</div>}
                {delitosAIFull.length>0&&(
                  <div>
                    <div style={{color:C.textGold,fontFamily:"monospace",fontSize:"10px",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:"8px"}}>Posibles delitos detectados — incluidos automáticamente en la ficha:</div>
                    <div style={{display:"grid",gap:"6px"}}>
                      {delitosAIFull.map((d,i)=>(
                        <div key={i} style={{background:"#0f1e10",border:"1px solid #2a4a2a",borderRadius:"6px",padding:"10px 14px",display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:"8px",alignItems:"center"}}>
                          <div>
                            <span style={{color:"#7dcc7d",fontFamily:"monospace",fontWeight:"700",fontSize:"12px"}}>{d.articulo}</span>
                            <span style={{color:C.text,fontSize:"13px",marginLeft:"10px"}}>{d.tipo}</span>
                          </div>
                          <div style={{color:C.textMuted,fontSize:"11px",fontFamily:"monospace"}}>{d.pena}</div>
                          {d.obs&&<div style={{color:"#aac",fontSize:"11px",fontStyle:"italic",gridColumn:"1/-1",paddingTop:"4px"}}>{d.obs}</div>}
                        </div>
                      ))}
                    </div>
                    <button onClick={()=>{setDelitosAI([]);setDelitosAIFull([]);}} style={{background:"transparent",border:"none",color:C.red,fontFamily:"monospace",fontSize:"11px",cursor:"pointer",marginTop:"8px",padding:"4px 0"}}>✕ Limpiar sugerencias</button>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* — Selección manual adicional — */}
          <div style={{marginBottom:"18px"}}>
            <label style={{...lbl,marginBottom:"8px"}}>Delitos adicionales — selección manual (opcional)</label>
            <div style={{background:C.iBg,border:`1px solid ${C.iBorder}`,borderRadius:"7px",padding:"12px",maxHeight:"220px",overflowY:"auto",display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px"}}>
              {DELITOS_MANUAL.map(d=>(
                <label key={d} style={{display:"flex",alignItems:"center",gap:"7px",cursor:"pointer",padding:"5px 7px",borderRadius:"5px",background:delitos.includes(d)?C.goldFaint:"transparent",transition:"background .12s"}}>
                  <input type="checkbox" checked={delitos.includes(d)} onChange={()=>toggleDelito(d)} style={{accentColor:C.gold,cursor:"pointer",flexShrink:0}}/>
                  <span style={{color:delitos.includes(d)?C.textGold:C.textMuted,fontSize:"11px",fontFamily:"monospace"}}>{d}</span>
                </label>
              ))}
            </div>
            {delitos.length>0&&(
              <div style={{marginTop:"8px",display:"flex",flexWrap:"wrap",gap:"5px"}}>
                {delitos.map(d=>(
                  <span key={d} style={{background:C.goldFaint,border:`1px solid ${C.gold}66`,color:C.textGold,borderRadius:"4px",padding:"3px 9px",fontSize:"10px",fontFamily:"monospace"}}>
                    {d.split("—")[0].trim()}
                    <span onClick={()=>toggleDelito(d)} style={{cursor:"pointer",marginLeft:"5px",color:C.red}}>×</span>
                  </span>
                ))}
              </div>
            )}
          </div>

          {/* — Actuación policial + advertencia — */}
          <div style={{marginBottom:"14px"}}>
            <FSelect label="Actuación policial adoptada" value={actuacion} onChange={setActuacion} options={ACTUACIONES}/>
            {isTraslado&&(
              <div style={{marginTop:"10px",background:C.warn,border:`1px solid ${C.warnBorder}`,borderRadius:"7px",padding:"12px 16px",animation:"fadeIn .25s ease"}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}}>
                  <span style={{fontSize:"16px"}}>⚠️</span>
                  <span style={{color:C.gold,fontFamily:"monospace",fontWeight:"700",fontSize:"11px",letterSpacing:"0.1em"}}>RECUERDA — TRASLADO PARA IDENTIFICACIÓN</span>
                </div>
                <div style={{color:"#e8d080",fontSize:"13px",lineHeight:"1.6"}}>
                  Realizar <strong>minuta o comparecencia</strong>, apuntar en el <strong>libro de identificaciones</strong> y rellenar el <strong>acta de identificación</strong>.
                </div>
              </div>
            )}
          </div>

          {/* — Asistencia médica — */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
            <FSelect label="Asistencia médica ofrecida" value={asistenciaOf} onChange={setAsistenciaOf} options={["Sí","No"]}/>
            <FSelect label="Asistencia médica aceptada" value={asistenciaAc} onChange={setAsistenciaAc} options={["Sí","No"]}/>
          </div>

        </Sec>

        {/* ── BOTÓN FINAL ── */}
        <div style={{textAlign:"center",padding:"10px 0 20px"}}>
          <button onClick={copyFicha}
            style={{background:copied?C.green:`linear-gradient(135deg,${C.gold},#e8c87a)`,color:"#08111e",border:"none",borderRadius:"8px",padding:"14px 52px",fontFamily:"monospace",fontWeight:"700",fontSize:"14px",cursor:"pointer",letterSpacing:"0.1em",boxShadow:copied?"none":`0 4px 22px ${C.gold}55`,transition:"all .25s"}}>
            {copied?"✓  FICHA COPIADA AL PORTAPAPELES":"📋  COPIAR FICHA PARA GENERAR COMPARECENCIA"}
          </button>
          <div style={{color:C.textMuted,fontFamily:"monospace",fontSize:"10px",marginTop:"10px",letterSpacing:"0.06em"}}>Pega la ficha en el chat de Claude para generar la comparecencia policial oficial</div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
